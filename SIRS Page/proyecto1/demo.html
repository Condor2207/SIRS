<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperStock Demo | Cargando…</title>
  <meta http-equiv="refresh" content="2;url=frontend/index.html" />
  <style>
    :root {
      --primary: #10B981;
      --secondary: #34D399;
      --bg: #0f2b1e;
      --text: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      padding: 2rem;
      text-align: center;
    }
    .logo { font-size: 3rem; }
    h1 { font-size: 1.8rem; font-weight: 900; color: var(--secondary); letter-spacing: -.4px; }
    p { color: rgba(255,255,255,.7); font-size: 1rem; max-width: 420px; line-height: 1.6; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(52,211,153,.25);
      border-top-color: var(--secondary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .manual-link {
      display: inline-block;
      margin-top: .4rem;
      padding: .65rem 1.4rem;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      text-decoration: none;
      transition: background .18s;
    }
    .manual-link:hover { background: var(--secondary); color: #053225; }
    .back-link {
      position: fixed;
      top: 1rem; left: 1rem;
      color: rgba(255,255,255,.5);
      font-size: .82rem;
      text-decoration: none;
    }
    .back-link:hover { color: var(--secondary); }
  </style>
</head>
<body>
  <a href="../../index.html#projects" class="back-link">← Portfolio</a>
  <div class="logo">🛒</div>
  <h1>SuperStock Demo</h1>
  <p>Redirigiendo al sistema de gestión de supermercado…</p>
  <div class="spinner"></div>
  <a href="frontend/index.html" class="manual-link">Ingresar ahora</a>
  <script>
    // redirect immediately via JS (faster than meta-refresh)
    window.location.replace("frontend/index.html");
  </script>
</body>
</html>
